<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Git Cheat Sheet</title>
    <meta name="keywords" content="git, github, cheatsheet" />
    <link rel="stylesheet" href="./assets/styles/output.css" />
    <link rel="stylesheet" href="./assets/styles/toastify.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/png"
    />
    <meta
      name="description"
      content="A simple cheat sheet for git most used commands"
    />
  </head>
  <body
    class="bg-[url('../images/github-bg.png')] bg-no-repeat bg-center bg-fixed bg-cover min-h-svh grid grid-rows-[auto_1fr_auto]"
  >
    <header
      class="bg-neutral-500 text-neutral-900 px-4 py-2 flex justify-center items-center gap-4 ring-1 ring-neutral-400 shadow-sm shadow-neutral-400/50 sticky top-0 z-10"
    >
      <figure class="w-12 sm:w-16 h-12 sm:h-16">
        <img
          src="./assets/images/Github-logo.svg"
          class="size-full object-cover"
          alt="GitHub logo"
        />
      </figure>

      <h1 class="hidden sm:block text-2xl font-bold capitalize">
        Git Commands Cheat Sheet
      </h1>
    </header>

    <main id="main">
      <hgroup
        class="grid gap-4 place-content-center place-items-center min-h-dvh mb-10 text-neutral-100 backdrop-blur-[2px]"
      >
        <h2 class="text-4xl md:text-6xl font-bold capitalize">
          Quick Git Reference
        </h2>

        <p class="md:text-lg font-medium capitalize text-neutral-400">
          scroll down to explore Git commands.
        </p>

        <a
          class="bg-neutral-500/80 text-neutral-100 border border-neutral-100/20 p-1 rounded-md cursor-pointer animate-bounce transform-gpu will-change-transform hover:bg-neutral-500 transition-colors ease-in-out duration-300"
          aria-label="scroll to getting started section"
          href="#getting-started"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            aria-hidden="true"
            class="size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m19.5 8.25-7.5 7.5-7.5-7.5"
            />
          </svg>
        </a>
      </hgroup>
    </main>

    <footer
      class="text-lg bg-neutral-500 text-neutral-900 mt-20 px-4 py-2 ring-1 ring-neutral-400 shadow-sm shadow-neutral-400/50"
    >
      <p class="capitalize font-medium text-center">
        made with 🖤 by
        <a
          class="font-bold border-b-2 border-neutral-900"
          href="https://github.com/Ali-boorboor"
          rel="noopener noreferrer"
          target="_blank"
        >
          Ali boorboor
        </a>
      </p>
    </footer>

    <script src="./assets/scripts/main.js" type="module"></script>
  </body>
</html>
