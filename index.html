<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/styles/output.css" />
    <title>Git Cheat Sheet</title>
  </head>
  <body
    class="bg-[url('../images/github-bg.png')] bg-no-repeat bg-center bg-fixed bg-cover min-h-dvh grid grid-rows-[auto_1fr_auto]"
  >
    <header
      class="bg-neutral-500 text-neutral-900 px-4 py-2 flex justify-center items-center gap-4 ring-1 ring-neutral-400 shadow-sm shadow-neutral-400/50 sticky top-0"
    >
      <figure class="w-16 h-16">
        <img
          src="./assets/images/Github-logo.svg"
          class="size-full object-cover"
          alt="github logo"
        />
      </figure>

      <h1 class="sm:text-lg md:text-2xl font-bold capitalize">
        Git Commands Cheat Sheet
      </h1>
    </header>

    <main class="" id="main">
      <hgroup
        class="grid gap-4 place-content-center place-items-center min-h-dvh text-neutral-100"
      >
        <h2 class="sm:text-2xl md:text-6xl font-bold capitalize">Welcome</h2>

        <p class="md:text-lg font-medium capitalize text-neutral-400">
          scroll down to see commands
        </p>

        <a
          class="bg-neutral-500/80 text-neutral-100 border border-neutral-100/20 p-1 rounded-md cursor-pointer animate-bounce transform-gpu will-change-transform hover:bg-neutral-500 transition-colors ease-in-out duration-300"
          href="#getting-started"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m19.5 8.25-7.5 7.5-7.5-7.5"
            />
          </svg>
        </a>
      </hgroup>

      <section
        class="flex gap-4 justify-between items-center px-4 py-2 bg-neutral-800 text-neutral-300 ring-1 ring-neutral-400 shadow-sm shadow-neutral-400/50"
        id="getting-started"
      >
        <h3
          class="md:text-xl font-semibold capitalize text-neutral-100 relative before:absolute before:w-full before:h-1 before:bg-neutral-100 before:-bottom-1.5 before:left-0 before:right-0 before:mx-auto before:rounded-md before:transition-all before:ease-in-out before:duration-300 hover:before:w-1/2"
        >
          Getting Started
        </h3>

        <div class="grid-box">
          <div
            class="bg-neutral-900 text-neutral-100 p-2.5 ring-1 ring-neutral-100/20 rounded-md"
          >
            <header class="flex gap-4 items-center justify-between mb-1.5">
              <h4>Start a new repo</h4>

              <button
                class="bg-neutral-500/80 text-neutral-100 border border-neutral-100/20 p-1 rounded-md cursor-pointer hover:bg-neutral-500 transition-colors ease-in-out duration-300"
                data-command="git init"
                type="button"
                title="copy"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="size-6"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 0 1-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 0 1 1.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 0 0-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 0 1-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H9.75"
                  />
                </svg>
              </button>
            </header>

            <code
              class="bg-neutral-500 text-neutral-100 border border-neutral-100/20 py-1 px-2 rounded-md text-sm"
            >
              git init
            </code>
          </div>
        </div>
      </section>
    </main>

    <footer
      class="bg-neutral-500 text-neutral-900 px-4 py-2 ring-1 ring-neutral-400 shadow-sm shadow-neutral-400/50"
    >
      <p class="capitalize font-medium text-center">
        made with 🖤 by <strong>Ali boorboor</strong>
      </p>
    </footer>
  </body>
</html>
